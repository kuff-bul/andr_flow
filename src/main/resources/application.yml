server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: flow-manager

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/flow_manager}
    username: ${POSTGRES_USER:flow_manager}
    password: ${POSTGRES_PASSWORD:flow_manager}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:flow-manager}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual

app:
  kafka:
    conversion-request-topic: ${KAFKA_CONVERSION_REQUEST_TOPIC:document-conversion-input}
    conversion-result-topic: ${KAFKA_CONVERSION_RESULT_TOPIC:document-conversion-output}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:documents}
