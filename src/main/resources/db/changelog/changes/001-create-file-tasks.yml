databaseChangeLog:
  - changeSet:
      id: 001-create-file-tasks
      author: codex
      changes:
        - createTable:
            tableName: file_tasks
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_file_tasks
                    nullable: false
              - column:
                  name: original_file_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: original_minio_path
                  type: varchar(1024)
                  constraints:
                    nullable: false
              - column:
                  name: converted_minio_path
                  type: varchar(1024)
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: varchar(2048)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: >
              alter table file_tasks
              add constraint chk_file_tasks_status
              check (status in ('PROCESSING', 'SUCCESS', 'ERROR'))
